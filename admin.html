<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin login - Night Owl Bar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">

<div class="login-card card p-4 shadow">
  <h1 class="h4 text-center mb-1">Night Owl Bar</h1>
  <p class="text-center text-muted mb-4">Admin login</p>

  <form id="loginForm" novalidate>
    <div class="mb-3">
      <label class="form-label" for="username">Your name (waiter)</label>
      <input type="text" id="username" class="form-control" autocomplete="username" maxlength="30"  required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" autocomplete="current-password" required>
    </div>
    <div id="loginError" class="text-danger small mb-3 d-none"></div>
    <button type="submit" class="btn btn-warning w-100">Login</button>
  </form>

  <a href="index.html" class="d-block text-center mt-3 small"><i class="bi bi-arrow-left"></i> Back to website</a>
</div>

<script src="admin.js"></script>
</body>
</html>
