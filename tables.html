<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tables - Night Owl Bar</title>


  <script>
    if (sessionStorage.getItem('admin_auth') !== '1') location.replace('admin.html');
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark sticky-top">
  <div class="container">
    <span class="navbar-brand fw-bold">Night Owl Bar - Tables</span>
    <div class="d-flex align-items-center gap-2">
      <span id="waiterLabel" class="text-light small me-1"></span>
      <a href="index.html" class="btn btn-outline-light btn-sm">Website</a>
      <button type="button" id="logoutBtn" class="btn btn-outline-warning btn-sm">Logout</button>
    </div>
  </div>
</nav>

<main class="container py-4">
  <div class="d-flex gap-3 mb-3 small">
    <span><span class="legend-dot free"></span> Free</span>
    <span><span class="legend-dot occupied"></span> Occupied</span>
  </div>


  <div id="tablesGrid" class="floor"></div>
</main>

<!-- TABLE MODAL -->
<div class="modal fade" id="tableModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="modalTitle">Table</h5>
          <div class="small text-muted">Waiter: <strong id="waiterName"></strong></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <!-- add item -->
        <form id="addItemForm" class="row g-2 mb-1" autocomplete="off">
          <div class="col-8">
            <input type="text" id="itemInput" class="form-control" list="menuList" placeholder="Item">
            <datalist id="menuList"></datalist>
          </div>
          <div class="col-2">
            <input type="number" id="qtyInput" class="form-control" min="1" max="99" value="1" aria-label="Quantity">
          </div>
          <div class="col-2 d-grid">
            <button type="submit" class="btn btn-warning" aria-label="Add"><i class="bi bi-plus-lg"></i></button>
          </div>
        </form>
        <div id="itemError" class="text-danger small mb-2 d-none"></div>

        <!-- ordered items -->
        <ul id="orderList" class="list-group my-3"></ul>

        <!-- total and status -->
        <div class="d-flex justify-content-between align-items-center">
          <div class="fs-5">Bill: <strong id="totalPrice">0 ден</strong></div>
          <span id="statusBadge" class="badge fs-6"></span>
        </div>

        <!-- payment money received, tip, change -->
        <div class="payment-box mt-3">
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label small mb-1" for="receivedInput">Money received</label>
              <input type="number" id="receivedInput" class="form-control" min="0" step="any" placeholder="0">
            </div>
            <div class="col-6">
              <label class="form-label small mb-1" for="tipInput">Tip</label>
              <input type="number" id="tipInput" class="form-control" min="0" step="any" placeholder="0">
            </div>
            <div class="col-12">
              <label class="form-label small mb-1" for="changeOutput">Change to give back</label>
              <input type="text" id="changeOutput" class="form-control fw-bold" readonly placeholder="—">
            </div>
          </div>
          <div id="dueLine" class="small text-muted mt-2"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" id="payBtn" class="btn btn-success d-none">Mark as paid</button>
        <button type="button" id="closeTableBtn" class="btn btn-danger d-none">Close table</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script>
  document.getElementById('waiterLabel').textContent =
          'Waiter: ' + (sessionStorage.getItem('admin_user') || '—');

  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('admin_auth');
    sessionStorage.removeItem('admin_user');
    location.replace('admin.html');
  });

  window.addEventListener('pageshow', () => {
    if (sessionStorage.getItem('admin_auth') !== '1') location.replace('admin.html');
  });
</script>

<script src="menu.js"></script>
<script src="tables.js"></script>
</body>
</html>
